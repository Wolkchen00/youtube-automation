name: Still Home Daily

# 'STILL HOME' gunluk seridi (shadowedhistory kanali, @shad0wedhistory357).
# Dayanak: shadowedhistory/KONSEPT.md v3.0. Ihsan karari 2026-09-13: eski TARIH
# konsepti (flashpoints ve 3 seri) arsive kaldirildi, kanal gelecek temali ve
# ANLATIMSIZ yeni bir konseptle yaziliyor. Olculen gerekce: flashpoints'in 15
# videosunda medyan 24 izlenme, aralik 0-1.179.
#
# Format v2.0 (Ihsan direktifi 15 Eylul 2026): gercek ve DUNYACA TANINAN bir
# sehrin 2512'deki hali DORT CEKIMDE, UC SERT GECISLE gosterilir. Cekimler
# olcek sirasindadir: havadan sehir -> yer seviyesi insanlar+makineler ->
# makine olcegi -> sicak ev ayrintisi. Motor 4 sn'nin altinda klip uretemedigi
# icin 4 x 4 sn uretilir ve micro_trim 0,75 ile her biri 2,5 sn'ye iner:
# bolum 10,0 sn. Konu, sehrin basina gelen bir felaket DEGIL sehrin KURDUGU
# calisan teknolojidir (manyetik ulasim, otonom insaat, enerji mimarisi,
# yasayan malzeme, otomatik uretim, yorunge baglantisi).
# Anlatim YOK. Tek ses: ~2 kHz'de kesik derin drone, -14 LUFS. Kunye ekrana
# DAKTILO ile yazilir (SEHIR + 2512) ve ILK kesmede (2,5 sn) soluar.
#
# Olculen kazanma sarti: TANINIR SEHIR. Referansta ayni kanal ve ayni formatta
# taninir sehir 46.042 begeni aldi, isimsiz kubbe 124 (371 kat fark). Bu bulgu
# bizim aimagine olcumumuzle bagimsiz olarak ortusuyor.
#
# Format v3.0 (Ihsan direktifi 18 Eylul 2026, "ilk 3 saniye ekrana kitlensin"):
# SILUET KURALI. Bolumun teknolojisi sehrin siluetini degistiren FIZIKSEL bir
# yapidir ve ilk karede tamamlanmis, tam calisir halde durur. Olculen gerekce:
# part 3'te teknoloji bir ISIKTI, motor once bugunun Paris'ini cizip isigi
# 1,25 sn'de acti, ilk kare bugunun drone fotografindan ayirt edilemedi ve
# bolum 21 izlenmede kaldi (P1 648, P2 875). Isik surucu iki aile artik gece
# geciyor. Kesme sayisi DEGISMEDI: 3 kesme olculdu (2,54 / 5,04 / 7,54) ve
# korunuyor.
#
# publish_mode="auto": uretilen bolum dogrudan 3 platforma cikar. Canli gunluk
# seridin (wild-encounter) filo gelenegiyle ayni. Gunde-1 kanal kilidi yine
# gecerli, yani bir gunde ikinci video CIKMAZ.
# Doktrin kapisi: kosu basinda KONSEPT SHA-256 loglanir, pin/damga eslesmezse
# fail-closed. kie-uretim concurrency grubu hatlari fiilen serilestirir.

# CANLI , 13 Eylul 2026. Ihsan karari: "tamam bunu paylasalim, yeni pipeline bunu
# yerlestirelim ... her gun yeni bir populer sehir olsun". KONSEPT.md v1.0 ONAYLANDI,
# series.json status=active + publish_mode=auto. Part 1 (ISTANBUL 2512) elle
# yayinlandi (3/3 platform), bu serit part 2'den itibaren devraliyor.
# Durdurmak icin: asagidaki schedule blogunu yorumla + series.json status='paused'.

on:
  schedule:
    - cron: '30 20 * * *'   # 20:30 UTC, shadowedhistory kanalinin tarihsel yayin penceresi
  workflow_dispatch:

concurrency:
  group: kie-uretim
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env
        run: |
          cat > .env << 'EOF'
          KIE_AI_API_KEY=${{ secrets.KIE_AI_API_KEY }}
          IMGBB_API_KEY=${{ secrets.IMGBB_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_QC=${{ secrets.GEMINI_API_KEY_QC }}
          UPLOAD_POST_API_KEY=${{ secrets.UPLOAD_POST_API_KEY }}
          YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          # 18 Eylul 2026: 1200 -> 900. Sebep OLCULDU. Baslangic kapisi
          # bakiyeden 1,5 x cap ister, yani 1200 cap = 1800 esik ve bu
          # filonun EN YUKSEK kapisiydi (digerleri 900 -> 1350). Ama
          # bu seri filonun en UCUZ islerinden birini yapiyor: part 3
          # regen'leriyle birlikte defterde 189 kredi (part 2: 206).
          # Yani 189 kredilik is icin kasada 1800 bekleniyordu ve hat
          # gecenin sonunda kostugu icin artakalani buluyordu: 17 Eylul
          # bakiye=1632 ile kapiya carpti, o gun kanal karanlik kaldi.
          # 900 muhafazakar tahminle 4 ana cekim (320) + muzik (80) +
          # 6 regen (480) tasir; part 3'un gercekte kullandigi en yogun
          # bolum 4 ana + 4 regen'di, yani pay hala var.
          EPISODE_CREDIT_CAP=900
          MONTHLY_CREDIT_CAP=60000
          EOF

      - name: Prepare dirs
        run: mkdir -p logs output

      - name: Kosu baslangicini damgala
        # last_run.json'un outcome'u BU KOSUDA dogrulanmis YouTube yayinina
        # bakar. Damga olmadan dunku bir yayin kaydi bugunku sessizligi orter.
        run: echo "KOSU_BASLANGIC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Onay kuyrugunu isle (Telegram)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        # shell: bash = pipefail. Bu satir olmadan `| tee`
        # python'un exit kodunu yutuyor ve hata GORUNMUYOR.
        shell: bash
        run: python -X utf8 -m series.approver --series still-home 2>&1 | tee logs/still_home_approve.log

      - name: Oto-ikmal (kuyruk azaldiysa Gemini yeni bolum planlari yazar, kredi harcamaz)
        # continue-on-error: ikmal patlasa bile kuyrukta gecerli bolum
        # varsa o gunun yayini iptal olmasin; adim yine KIRMIZI gorunur.
        shell: bash
        continue-on-error: true
        run: python -X utf8 -m series.replenish --series still-home 2>&1 | tee logs/still_home_replenish.log

      - name: Doktrin kapisi (uretimden ONCE, kredi harcamaz)
        # tools/siluet_denetim.py 18 Eylul'de yazildi ama HICBIR yerde
        # kosmuyordu: ne burada, ne testlerde. 19 Eylul'de part 5'in cekim 1 ve
        # cekim 3 prompt'lari "Christ the Redeemer" yaziyordu, yani doktrin
        # kural 7'yi ("gercek kisi YOK") aciktan cigniyordu. Kimse bakmadigi
        # icin plan kuyruga girdi, cekim 3'un regen'i saglayicida "flagged for
        # containing a prominent public figure" ile 5/5 bloklandi, min_shots=4
        # kapisi bolumu oldurdu: 315 kredi, sifir video, karanlik kanal.
        #
        # Kapi SERT ve ikmalden SONRA kosar (yeni yazilan plani da gorur).
        # Yalniz o gece uretilecek bolume bakar: kuyrugun ilerisindeki bir
        # bulgu bu gecenin yayinini oldurmemeli.
        #
        # shell: bash = pipefail. Bu satir olmadan `| tee` python'un exit
        # kodunu yutar ve kapi sessizce acik kalir (ROCK 3 dersi).
        shell: bash
        run: python -X utf8 tools/siluet_denetim.py --next-only 2>&1 | tee logs/still_home_doktrin.log

      - name: Produce + publish (Still Home siradaki bolum)
        id: produce
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # shell: bash = pipefail; tee'nin 0'i python'un exit kodunu maskeliyordu (ROCK 3).
        shell: bash
        run: python -X utf8 -m series.series_runner --series still-home 2>&1 | tee logs/still_home_run.log

      - name: Uretim sonucunu kaydet
        if: always()
        run: |
          # Sonuc adimin cikis kodundan DEGIL, gercek YouTube yayin
          # kanitindan turetilir. Eski hali sifir video ureten kosuya
          # 'success' yaziyordu (event-horizon, 2026-09-03T19:26 , o dersin mirasi).
          python -X utf8 scripts/kosu_sonucu_yaz.py \
            --out shadowedhistory/still-home/last_run.json \
            --run-id "${{ github.run_id }}" \
            --raw-outcome "${{ steps.produce.outcome }}" \
            --since "$KOSU_BASLANGIC" \
            --published-json shadowedhistory/still-home/published.json

      - name: Persist series state
        if: always()
        run: |
          bash scripts/persist_state.sh \
            "chore: still-home durumunu ilerlet [skip ci]" \
            sentinal_ihsan/ aimagine/ galactic_experience/ shadowedhistory/ \
            credits_ledger.json shadowedhistory/still-home/last_run.json

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: still-home-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7

      - name: Basarisizlikta Telegram'a haber ver
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl --silent --max-time 20 --request POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=🚨 Still Home (Shadowed History) workflow basarisiz , bu kanala bugun video CIKMAYABILIR: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              >/dev/null 2>&1 || true
          fi
