name: YouTube Weekly Analytics

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 8 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: Çalıştırılacak analitik modu
        required: true
        default: report
        type: choice
        options:
          - snapshot
          - report

permissions:
  contents: write

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env file
        run: |
          cat > .env << EOF
          YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          EOF

      - name: Prepare directories
        run: mkdir -p logs analytics_data/daily

      - name: Take daily snapshot
        if: github.event.schedule == '0 7 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'snapshot')
        run: |
          set -o pipefail
          python -X utf8 -m core.analytics --snapshot 2>&1 | tee logs/analytics_snapshot.log

      - name: Generate weekly report
        if: github.event.schedule == '0 8 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'report')
        run: |
          set -o pipefail
          python -X utf8 -m core.analytics --report 2>&1 | tee logs/analytics_report.log

      - name: Persist analytics data
        if: always()
        run: |
          bash scripts/persist_state.sh \
            "chore: analitik verisi [skip ci]" \
            analytics_data/

      - name: Upload analytics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-${{ github.run_number }}
          path: analytics_data/
          retention-days: 30
