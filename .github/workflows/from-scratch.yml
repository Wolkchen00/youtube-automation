name: From Scratch Daily

# 'FROM SCRATCH' gunluk seridi (aimagine kanali, @aimagine_._357). Dayanak: aimagine/KONSEPT.md
# (v1.5, ONAYLANDI). Ihsan karari 2026-07-29: "TUM KANALLARI ACALIM GUNLUK 1 VIDEO".
# Format: 4 x 8 sn Building From Scratch, anlatimsiz, teaser acik, hook_shot = cekim 4.
# publish_mode="auto": Ihsan'in 2026-07-30 onay dondurma karari surer; basarili video
# otomatik yayinlanir. Doktrin kapisi: kosu basinda KONSEPT SHA-256 loglanir,
# pin/damga eslesmezse fail-closed.
# Saat duzeni: bu kosu 14:30 UTC -> event-horizon 16:30 -> unnatural-lab 18:30 -> flashpoints 20:30.
# kie-uretim concurrency grubu 4 hatti fiilen serilestirir (Kie kredi guvenligi, FAZ 1 kurali).

on:
  # DURAKLATILDI 2026-09-02 (Ihsan karari): aimagine kanali gunde 2 video
  # cikariyordu. Kanal artik yalniz 'Next Stop' seridiyle gunde 1 video
  # yayinlar. Gunde-1 kilidi (series_runner.py:537) yalnizca next-stop
  # YAYINLADIKTAN sonra devreye giriyordu; next-stop basarisiz oldugu gun
  # bu kosu tam bedelle uretiyordu (2026-09-02: 1134 kredi, sifir video).
  # Seri durumu 'active' ve next_part=11 olarak birakildi; schedule
  # yorumunu kaldirmak seriyi tam kaldigi bolumden geri acar.
  # schedule:
  #   - cron: '30 14 * * *'   # 14:30 UTC, aimagine kanalinin tarihsel yayin penceresi
  workflow_dispatch:

concurrency:
  group: kie-uretim
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env
        run: |
          cat > .env << 'EOF'
          KIE_AI_API_KEY=${{ secrets.KIE_AI_API_KEY }}
          IMGBB_API_KEY=${{ secrets.IMGBB_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_QC=${{ secrets.GEMINI_API_KEY_QC }}
          UPLOAD_POST_API_KEY=${{ secrets.UPLOAD_POST_API_KEY }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          # 80 muzik + 6 x 200 ana cekim + 3 x 200 QC regen = 1880; 20 kredi guvenlik payi.
          EPISODE_CREDIT_CAP=1900
          MONTHLY_CREDIT_CAP=60000
          EOF

      - name: Prepare dirs
        run: mkdir -p logs output

      - name: Onay kuyrugunu isle (Telegram)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        # shell: bash = pipefail. Bu satir olmadan `| tee`
        # python'un exit kodunu yutuyor ve hata GORUNMUYOR.
        shell: bash
        run: python -X utf8 -m series.approver --series from-scratch 2>&1 | tee logs/from_scratch_approve.log

      - name: Oto-ikmal (kuyruk azaldiysa Gemini yeni bolum planlari yazar, kredi harcamaz)
        # shell: bash = pipefail. Bu adim olmadan `| tee` replenish'in
        # exit 1'ini yutuyordu ve ikmal basarisizligi ASLA gorunmuyordu
        # (Galactic 2026-09-01..04 arasi dort gun sessiz, dort yesil kosu).
        # continue-on-error: ikmal patlasa bile kuyrukta gecerli bolum
        # varsa o gunun yayini iptal olmasin; adim yine KIRMIZI gorunur.
        shell: bash
        continue-on-error: true
        run: python -X utf8 -m series.replenish --series from-scratch 2>&1 | tee logs/from_scratch_replenish.log

      - name: Produce + publish (From Scratch siradaki bolum)
        id: produce
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # shell: bash = pipefail; 'python | tee' kalibinda tee'nin 0'i python'un exit
        # kodunu maskeliyordu (2026-08-09..12 sahte-yesil kesintisi). Plan 1 ROCK 3.
        shell: bash
        run: python -X utf8 -m series.series_runner --series from-scratch 2>&1 | tee logs/from_scratch_run.log

      - name: Uretim sonucunu kaydet
        if: always()
        run: |
          raw_outcome="${{ steps.produce.outcome }}"
          outcome=failure
          if [ "$raw_outcome" = "success" ]; then outcome=success; fi
          printf '{"ts":"%s","outcome":"%s","raw_outcome":"%s","run_id":%s}\n' \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$outcome" "$raw_outcome" "${{ github.run_id }}" \
            > aimagine/from-scratch/last_run.json

      - name: Persist series state
        if: always()
        run: |
          bash scripts/persist_state.sh \
            "chore: from-scratch durumunu ilerlet [skip ci]" \
            sentinal_ihsan/ aimagine/ galactic_experience/ shadowedhistory/ \
            credits_ledger.json aimagine/from-scratch/last_run.json

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: from-scratch-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7
