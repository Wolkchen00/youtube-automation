name: Event Horizon Daily

# 'EVENT HORIZON' gunluk seridi (galactic kanali, @galacticexperiment-x6l). Dayanak:
# galactic_experience/KONSEPT.md (v1.5, ONAYLANDI). Ihsan karari 2026-07-29: "TUM KANALLARI
# ACALIM GUNLUK 1 VIDEO". Format: 3 x 6 sn gercek uzay-fakti, seed_id'li 27'lik dogrulanmis
# konu havuzu, teaser kapali. publish_mode="approval": onay gelmeden yayin yok. Doktrin
# kapisi: kosu basinda KONSEPT SHA-256 loglanir, pin/damga eslesmezse fail-closed.
# Saat duzeni: next-stop 13:20 -> BU KOSU 16:30 -> unnatural-lab 18:30 -> flashpoints 20:30.
# from-scratch DURAKLATILDI. kie-uretim concurrency grubu 4 hatti fiilen serilestirir (FAZ 1 kurali).

on:
  schedule:
    - cron: '30 16 * * *'   # 16:30 UTC, galactic kanalinin tarihsel yayin penceresi
  workflow_dispatch:

concurrency:
  group: kie-uretim
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env
        run: |
          cat > .env << 'EOF'
          KIE_AI_API_KEY=${{ secrets.KIE_AI_API_KEY }}
          IMGBB_API_KEY=${{ secrets.IMGBB_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_QC=${{ secrets.GEMINI_API_KEY_QC }}
          UPLOAD_POST_API_KEY=${{ secrets.UPLOAD_POST_API_KEY }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          EPISODE_CREDIT_CAP=900
          MONTHLY_CREDIT_CAP=60000
          EOF

      - name: Prepare dirs
        run: mkdir -p logs output

      - name: Kosu baslangicini damgala
        # last_run.json'un outcome'u BU KOSUDA dogrulanmis YouTube yayinina
        # bakar. Damga olmadan dunku bir yayin kaydi bugunku sessizligi orter.
        run: echo "KOSU_BASLANGIC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Onay kuyrugunu isle (Telegram)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        # shell: bash = pipefail. Bu satir olmadan `| tee`
        # python'un exit kodunu yutuyor ve hata GORUNMUYOR.
        shell: bash
        run: python -X utf8 -m series.approver --series event-horizon 2>&1 | tee logs/event_horizon_approve.log

      - name: Oto-ikmal (kuyruk azaldiysa Gemini yeni bolum planlari yazar, kredi harcamaz)
        # shell: bash = pipefail. Bu adim olmadan `| tee` replenish'in
        # exit 1'ini yutuyordu ve ikmal basarisizligi ASLA gorunmuyordu
        # (Galactic 2026-09-01..04 arasi dort gun sessiz, dort yesil kosu).
        # continue-on-error: ikmal patlasa bile kuyrukta gecerli bolum
        # varsa o gunun yayini iptal olmasin; adim yine KIRMIZI gorunur.
        shell: bash
        continue-on-error: true
        run: python -X utf8 -m series.replenish --series event-horizon 2>&1 | tee logs/event_horizon_replenish.log

      - name: Produce + publish (Event Horizon siradaki bolum)
        id: produce
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # shell: bash = pipefail; tee'nin 0'i python'un exit kodunu maskeliyordu (ROCK 3).
        shell: bash
        run: python -X utf8 -m series.series_runner --series event-horizon 2>&1 | tee logs/event_horizon_run.log

      - name: Uretim sonucunu kaydet
        if: always()
        run: |
          # Sonuc adimin cikis kodundan DEGIL, gercek YouTube yayin
          # kanitindan turetilir. Eski hali sifir video ureten kosuya
          # 'success' yaziyordu (event-horizon, 2026-09-03T19:26).
          python -X utf8 scripts/kosu_sonucu_yaz.py \
            --out galactic_experience/event-horizon/last_run.json \
            --run-id "${{ github.run_id }}" \
            --raw-outcome "${{ steps.produce.outcome }}" \
            --since "$KOSU_BASLANGIC" \
            --published-json galactic_experience/event-horizon/published.json

      - name: Persist series state
        if: always()
        run: |
          bash scripts/persist_state.sh \
            "chore: event-horizon durumunu ilerlet [skip ci]" \
            sentinal_ihsan/ aimagine/ galactic_experience/ shadowedhistory/ \
            credits_ledger.json galactic_experience/event-horizon/last_run.json

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-horizon-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7

      - name: Basarisizlikta Telegram'a haber ver
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl --silent --max-time 20 --request POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=🚨 Event Horizon (Galactic Experiment) workflow basarisiz , bu kanala bugun video CIKMAYABILIR: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              >/dev/null 2>&1 || true
          fi
