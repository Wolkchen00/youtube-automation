name: Fear Slide Daily

# 'KORKU KAYDIRAGI' gunluk seridi (aimagine kanali, @aimagine_._357).
# fearvisionofficiel formatinin tersine muhendislikle cozulmus uyarlamasi.
# Format: TEK kesintisiz 15 sn dikey 9:16 POV klip, seffaf kaydiraktan sehrin
# uzerinde asagi kayip havuza dusme. Klip zinciri YOK, bir rota = bir prompt = bir video.
# Motor: Kie / bytedance/seedance-2, 720p, native ses (konusma dahil).
# Sehir donusumu: Vegas -> Tokyo -> New York -> Dubai -> Toronto -> Paris -> Shanghai.
#
# 2026-09-03 Ihsan karari: kanal tren serisinden bu formata gecti. next-stop
# duraklatildi (commit 2ed94dc), aimagine altinda baska AKTIF seri yok, bu kosu
# kanalin tek uretim hatti.
#
# Saat duzeni: bu kosu 13:20 UTC (next-stop'tan bosalan pencere) -> event-horizon
# 16:30 -> unnatural-lab 18:30 -> flashpoints 20:30.
# kie-uretim concurrency grubu hatlari serilestirir (Kie kredi guvenligi).

on:
  schedule:
    - cron: '20 13 * * *'   # 13:20 UTC = 06:20 Los Angeles PDT
  workflow_dispatch:
    inputs:
      sehir:
        description: "Sirayi atla, bu rotayi uret (ornek: tokyo-skytree-mor-yagmur)"
        type: string
        required: false
        default: ""
      allow_same_day:
        description: "Ayni gune ikinci video koy (gunde-1 kilidini as)"
        type: boolean
        required: false
        default: false

concurrency:
  group: kie-uretim
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        # core/config.py python-dotenv kullaniyor. Sadece requests kurunca
        # ModuleNotFoundError: No module named 'dotenv' verdi (kosu 33807471604).
        # Depodaki diger butun is akislari da requirements.txt kuruyor.
        #
        # pytest AYRICA kuruluyor. requirements.txt bu deponun CALISMA ZAMANI
        # manifestosudur ve 18 workflow'un hepsi onu kuruyor; sadece-test
        # bagimliligi oraya konmaz. Asagidaki "Prompt testleri" adimi pytest
        # cagirdigi icin kosu 33897545943 "No module named pytest" ile exit 1
        # verdi ve aimagine kanalinin TEK gunluk seridi 2026-09-04'te uretime
        # hic baslamadan oldu. Test kapisi kredi harcamadan ONCE kostugu icin
        # KALIYOR; eksik olan bagimlilik kuruluyor.
        run: pip install -r requirements.txt pytest

      - name: Create .env
        run: |
          cat > .env << 'EOF'
          KIE_AI_API_KEY=${{ secrets.KIE_AI_API_KEY }}
          UPLOAD_POST_API_KEY=${{ secrets.UPLOAD_POST_API_KEY }}
          EOF

      - name: Prepare dirs
        run: mkdir -p logs

      - name: Kosu baslangicini damgala
        # last_run.json'un outcome'u BU KOSUDA dogrulanmis YouTube yayinina
        # bakar. Damga olmadan dunku bir yayin kaydi bugunku sessizligi orter.
        run: echo "KOSU_BASLANGIC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Prompt dogrulamasi (uretimden ONCE, kredi harcamaz)
        run: python -X utf8 AImagine-Fear/build.py --check

      - name: Prompt testleri
        run: python -X utf8 -m pytest AImagine-Fear/tests -q

      - name: Uret, denetle, yayinla
        id: produce
        env:
          KIE_AI_API_KEY: ${{ secrets.KIE_AI_API_KEY }}
        # shell: bash = pipefail; tee'nin 0'i python'un exit kodunu maskeliyordu.
        shell: bash
        run: |
          ARGS=""
          if [ -n "${{ inputs.sehir }}" ]; then ARGS="$ARGS --sehir ${{ inputs.sehir }}"; fi
          if [ "${{ inputs.allow_same_day }}" = "true" ]; then ARGS="$ARGS --allow-same-day"; fi
          python -X utf8 AImagine-Fear/tools/gunluk.py $ARGS 2>&1 | tee logs/fear_slide_run.log

      - name: Uretim sonucunu kaydet
        if: always()
        run: |
          # Sonuc adimin cikis kodundan DEGIL, gercek YouTube yayin
          # kanitindan turetilir. Eski hali sifir video ureten kosuya
          # 'success' yaziyordu (event-horizon, 2026-09-03T19:26).
          python -X utf8 scripts/kosu_sonucu_yaz.py \
            --out AImagine-Fear/last_run.json \
            --run-id "${{ github.run_id }}" \
            --raw-outcome "${{ steps.produce.outcome }}" \
            --since "$KOSU_BASLANGIC" \
            --yayin-jsonl AImagine-Fear/yayin.jsonl

      - name: Persist state
        if: always()
        run: |
          bash scripts/persist_state.sh \
            "chore: fear-slide durumunu ilerlet [skip ci]" \
            AImagine-Fear/yayin.jsonl AImagine-Fear/last_run.json

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fear-slide-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7

      - name: Basarisizlikta Telegram'a haber ver
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl --silent --max-time 20 --request POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=🚨 Fear Slide (AImagine) workflow basarisiz , bu kanala bugun video CIKMAYABILIR: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              >/dev/null 2>&1 || true
          fi
