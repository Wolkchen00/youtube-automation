name: Weekly Series Calibration

on:
  schedule:
    - cron: '0 9 * * 0'
  workflow_dispatch:

# Dört üretim workflow'u ile Kie kredi ve seri persist akisini serilestirir.
# Analytics, series-approve ve lokal kosular kapsam disidir. Yarislari iki
# tarafin hardened rebase-retry persist'i ve dosya basina ayrik yazim yonetir.
concurrency:
  group: kie-uretim
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env
        run: |
          cat > .env << 'EOF'
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_REELS_TOKEN=${{ secrets.NOTION_REELS_TOKEN }}
          NOTION_TOPIC_DB_ID=${{ secrets.NOTION_TOPIC_DB_ID }}
          EOF

      - name: Prepare logs
        run: mkdir -p logs

      - name: Measure and calibrate
        run: python -X utf8 -m series.calibrate 2>&1 | tee logs/calibrate.log

      - name: Persist calibration state
        if: always()
        run: |
          bash scripts/persist_state.sh \
            "chore: kalibrasyon guncellendi [skip ci]" \
            'sentinal_ihsan/*/calibration.json' \
            'aimagine/*/calibration.json' \
            'galactic_experience/*/calibration.json' \
            'shadowedhistory/*/calibration.json'

      - name: Upload calibration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibrate-logs-${{ github.run_number }}
          path: logs/calibrate.log
          retention-days: 7
