name: Flashpoints Daily

# 'FLASHPOINTS' gunluk seridi (shadowedhistory kanali, @shad0wedhistory357). Dayanak:
# shadowedhistory/KONSEPT.md (v1.7, ONAYLANDI). Ihsan karari 2026-07-29: "TUM KANALLARI
# ACALIM GUNLUK 1 VIDEO". Format: 2 x 8 sn tekil tarih-fakti, seed_id'li 27'lik dogrulanmis
# konu havuzu, title_card acik, teaser kapali. publish_mode="approval": onay gelmeden yayin
# yok. Doktrin kapisi: kosu basinda KONSEPT SHA-256 loglanir, pin/damga eslesmezse fail-closed.
# Saat duzeni: from-scratch 14:30 -> event-horizon 16:30 -> unnatural-lab 18:30 -> BU KOSU 20:30.
# kie-uretim concurrency grubu 4 hatti fiilen serilestirir (FAZ 1 kurali).

on:
  schedule:
    - cron: '30 20 * * *'   # 20:30 UTC, shadowedhistory kanalinin tarihsel yayin penceresi
  workflow_dispatch:

concurrency:
  group: kie-uretim
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env
        run: |
          cat > .env << 'EOF'
          KIE_AI_API_KEY=${{ secrets.KIE_AI_API_KEY }}
          IMGBB_API_KEY=${{ secrets.IMGBB_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          UPLOAD_POST_API_KEY=${{ secrets.UPLOAD_POST_API_KEY }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          EPISODE_CREDIT_CAP=900
          MONTHLY_CREDIT_CAP=60000
          EOF

      - name: Prepare dirs
        run: mkdir -p logs output

      - name: Onay kuyrugunu isle (Telegram)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: python -X utf8 -m series.approver --series flashpoints 2>&1 | tee logs/flashpoints_approve.log

      - name: Oto-ikmal (kuyruk azaldiysa Gemini yeni bolum planlari yazar, kredi harcamaz)
        run: python -X utf8 -m series.replenish --series flashpoints 2>&1 | tee logs/flashpoints_replenish.log

      - name: Produce + publish (Flashpoints siradaki bolum)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -X utf8 -m series.series_runner --series flashpoints 2>&1 | tee logs/flashpoints_run.log

      - name: Persist series state
        if: always()
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          success=false
          for i in 1 2 3; do
            git pull --rebase --autostash origin main || true
            git add sentinal_ihsan/ || true
            git add aimagine/ || true
            git add galactic_experience/ || true
            git add shadowedhistory/ || true
            git add credits_ledger.json || true
            if git diff --cached --quiet && [ "$(git rev-list --count origin/main..HEAD)" -eq 0 ]; then
              echo "Degisiklik yok"; success=true; break
            fi
            if ! git diff --cached --quiet; then
              git commit -m "chore: flashpoints durumunu ilerlet [skip ci]" || true
            fi
            if git push origin main; then success=true; break; fi
            echo "push denemesi $i basarisiz, 10s bekle..."; sleep 10
          done
          [ "$success" = true ] || exit 1

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flashpoints-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7
